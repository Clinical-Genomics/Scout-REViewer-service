---

name: Release Actions
on:
  release:
    types:
      - created

jobs:
  docker-image-release:
    runs-on: ubuntu-latest
    name: Push production docker image to dockerhub
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish production image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: "clinicalgenomics/scout-reviewer-service:latest,clinicalgenomics/scout-reviewer-service:${{ github.event.release.tag_name }}"
