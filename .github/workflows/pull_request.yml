---

name: Pull Request Actions

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
     - name: Check out git repository
       uses: actions/checkout@v7

     - name: Install uv
       uses: astral-sh/setup-uv@v9.0.0
       with:
         enable-cache: true
         cache-dependency-glob: "uv.lock"

     - name: Black
       run: uv run --frozen --only-group lint black --check .

     - name: isort
       run: uv run --frozen --only-group lint isort --check-only --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
     - name: Check out git repository
       uses: actions/checkout@v7

     - name: Install uv
       uses: astral-sh/setup-uv@v9.0.0
       with:
         enable-cache: true
         cache-dependency-glob: "uv.lock"

     - name: Run pytest
       run: uv run --frozen pytest

  docker-image-push:
    runs-on: ubuntu-latest
    name: Create staging docker image
    steps:
     - name: Check out git repository
       uses: actions/checkout@v7

     - name: Get branch name
       id: branch-name
       uses: tj-actions/branch-names@v9

     - name: Login to Docker Hub
       uses: docker/login-action@v4
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Set up Docker Buildx
       id: buildx
       uses: docker/setup-buildx-action@v4

     - name: Build and push
       if: steps.branch-name.outputs.is_default == 'false'
       id: docker_build
       uses: docker/build-push-action@v7
       with:
         context: ./
         file: ./Dockerfile
         platforms: linux/amd64
         provenance: mode=max
         sbom: true
         push: true
         tags: "clinicalgenomics/scout-reviewer-service-stage:${{steps.branch-name.outputs.current_branch}}, clinicalgenomics/scout-reviewer-service-stage:latest"
