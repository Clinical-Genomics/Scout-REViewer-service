[project]
name = "scout-reviewer-service"
version = "0.2"
authors = [
  { name="Fredrik Carlsson" },
  { name="Daniel Nilsson", email="daniel.k.nilsson@gmail.com" },
]
description = "A REST service for generating REViewer and TRGT plot output for STRs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles",
    "aiohttp",
    "fastapi",
    "pydantic>=2",
    "python-dotenv",
    "uvicorn[standard]",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"

[project.urls]
Homepage = "https://github.com/Clinical-Genomics/Scout-REViewer-service"
Issues = "https://github.com/Clinical-Genomics/Scout-REViewer-service/issues"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["main.py"]

[tool.hatch.build.targets.wheel]
packages = ["service"]

[dependency-groups]
dev = [
    "httpx2",
    "pysam>=0.24.1",
    "pytest",
]
lint = [
    "black",
    "isort",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
